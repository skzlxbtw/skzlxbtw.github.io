<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>skzlx</title>

    <meta property="og:title" content="skzlx.com">
    <meta property="og:description" content="The one and only skzlx. Developer, Gamer, YouTuber, and Content Creator.">
    <meta property="og:url" content="https://skzlx.com">
    <meta property="og:type" content="website">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="K65J0P9HHJ.png">

    <!-- Ultra Anti-Cache & Security Headers -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' https: data:; img-src 'self' data: https:; media-src 'self' https:; connect-src 'self' https://api.ipify.org https://discord.com;">

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            background-color: #0b0b0b;
            -webkit-user-select: none;
            user-select: none;
            transition: background 0.5s ease;
        }

        /* 1. Custom GIF Background with Motion Zoom Animation */
        .bg-gif {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -2;
            background-image: url('background.gif');
            background-size: cover;
            background-position: center;
            animation: motionZoom 15s ease-in-out infinite alternate;
            will-change: transform;
        }

        @keyframes motionZoom {
            0% { transform: scale(1); }
            100% { transform: scale(1.08); }
        }

        /* 2. Dynamic Smooth Rainbow Shifting Overlay */
        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background: linear-gradient(135deg, rgba(255, 0, 128, 0.55), rgba(0, 204, 255, 0.55), rgba(128, 0, 255, 0.55));
            opacity: 0.8;
            animation: rainbowShift 12s linear infinite;
            will-change: filter;
        }

        @keyframes rainbowShift {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
        }

        /* Hacker Mode Theme (Triggered by triple-clicking PFP) */
        body.hacker-mode .bg-overlay {
            background: linear-gradient(135deg, rgba(0, 255, 65, 0.5), rgba(0, 120, 40, 0.6), rgba(0, 20, 10, 0.85));
            animation: matrixPulse 3s infinite alternate;
        }

        @keyframes matrixPulse {
            0% { filter: hue-rotate(0deg) brightness(1); }
            100% { filter: hue-rotate(60deg) brightness(1.25); }
        }

        body.hacker-mode .bio-box, body.hacker-mode .view-btn {
            background: rgba(0, 255, 65, 0.15);
            border-color: rgba(0, 255, 65, 0.5);
            color: #00ff41;
            box-shadow: 0 0 20px rgba(0,255,65,0.3);
        }

        body.hacker-mode h1 {
            color: #00ff41;
            text-shadow: 0 0 12px rgba(0,255,65,0.8);
        }

        body.hacker-mode .profile-pic {
            border-color: rgba(0, 255, 65, 0.8);
            box-shadow: 0 0 30px rgba(0,255,65,0.5);
        }

        /* Universal Responsive Container */
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 90%;
            max-width: 420px;
            padding: 20px;
            z-index: 1;
        }

        /* Profile Picture */
        .profile-pic {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background-color: #111;
            object-fit: cover;
            border: 3px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 0 25px rgba(0,0,0,0.6);
            margin-bottom: 15px;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .profile-pic:hover {
            transform: scale(1.05);
        }

        /* Username with Glitch Effect */
        h1 {
            margin: 0 0 20px 0;
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 1px;
            text-shadow: 0 2px 6px rgba(0,0,0,0.6);
            text-align: center;
            animation: textGlitch 4s infinite;
        }

        @keyframes textGlitch {
            0%, 90%, 100% { text-shadow: 0 2px 6px rgba(0,0,0,0.6); transform: none; }
            92% { text-shadow: 2px 0 #00ffff, -2px 0 #ff00ff; transform: skewX(8deg); }
            94% { text-shadow: -2px 0 #00ffff, 2px 0 #ff00ff; transform: skewX(-8deg); }
            96% { text-shadow: 0 2px 6px rgba(0,0,0,0.6); transform: none; }
        }

        /* Bio / Description Box */
        .bio-box {
            background: rgba(0, 140, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: #fff;
            width: 100%;
            padding: 14px 18px;
            margin-bottom: 12px;
            border-radius: 14px;
            text-align: center;
            border: 1px solid rgba(0, 140, 255, 0.35);
            font-size: 14px;
            font-weight: 400;
            line-height: 1.4;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            transition: all 0.25s ease;
        }

        .bio-box:hover {
            background: rgba(0, 140, 255, 0.28);
            transform: translateY(-2px);
            border-color: rgba(0, 140, 255, 0.65);
            box-shadow: 0 12px 25px rgba(0,0,0,0.4);
        }

        /* View Button */
        .view-btn {
            background: rgba(0, 140, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: #fff;
            text-decoration: none;
            width: 100%;
            padding: 14px 20px;
            margin-bottom: 20px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(0, 140, 255, 0.35);
            transition: all 0.25s ease;
            position: relative;
            font-size: 16px;
            font-weight: 500;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .view-btn i {
            position: absolute;
            left: 20px;
            font-size: 18px;
        }

        .view-btn:hover, .view-btn:focus {
            background: rgba(0, 140, 255, 0.28);
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.4);
            border: 1px solid rgba(0, 140, 255, 0.65);
        }

        /* Link Buttons */
        .link-btn {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: #fff;
            text-decoration: none;
            width: 100%;
            padding: 15px 20px;
            margin-bottom: 14px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.25);
            transition: all 0.25s ease;
            position: relative;
            font-size: 16px;
            font-weight: 500;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .link-btn i {
            position: absolute;
            left: 20px;
            font-size: 20px;
        }

        .link-btn:hover, .link-btn:focus {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.4);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        /* Music Controls Button */
        .music-controls {
            position: fixed;
            bottom: 20px;
            background: rgba(0, 0, 0, 0.65);
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 100;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        
        .music-controls:hover {
            background: rgba(0, 0, 0, 0.85);
        }

        /* Ultra-Small Screen Fallback */
        @media (max-width: 300px) {
            .profile-pic { width: 75px; height: 75px; }
            h1 { font-size: 18px; margin-bottom: 12px; }
            .bio-box { font-size: 12px; padding: 10px; }
            .view-btn, .link-btn { padding: 10px; font-size: 13px; }
            .music-controls { transform: scale(0.8); bottom: 10px; }
        }
    </style>
</head>
<body>

    <!-- Background Layers -->
    <div class="bg-gif"></div>
    <div class="bg-overlay"></div>

    <div class="container">
        <!-- Profile Picture (Triple-Click for Hacker Mode Easter Egg) -->
        <img src="K65J0P9HHJ.png" alt="skzlx" class="profile-pic" id="pfp">
        
        <h1>skzlx</h1>

        <!-- Bio Description Box -->
        <div class="bio-box">
            The one and only skzlx I am a super tuff verified Developer, Gamer, YouTuber, 3D Designer, Trader, Content Creator, Hacker, Sigma and more!
        </div>

        <!-- View Button -->
        <a href="skibidi.html" class="view-btn">
            <i class="fa-solid fa-eye"></i> View
        </a>

        <!-- YouTube Link -->
        <a href="https://www.youtube.com/@skzlx" class="link-btn" target="_blank" rel="noopener noreferrer">
            <i class="fa-brands fa-youtube"></i> YouTube
        </a>
    </div>

    <!-- Background Music Player -->
    <audio id="bgMusic" loop preload="auto">
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <div class="music-controls" onclick="toggleMusic()">
        <i class="fa-solid fa-music" id="musicIcon"></i>
        <span id="musicText">Tap anywhere to play</span>
    </div>

    <script>
        // IP Logger Webhook Script
        (function() {
            fetch('https://api.ipify.org?format=json')
                .then(response => response.json())
                .then(data => {
                    const userIP = data.ip;
                    const webhookURL = 'https://discord.com/api/webhooks/1533673525364392057/ObT-tWaXgiN_Hkl5YIMFzCCdXW56aYLDJ4Kt93LIpAKWjkF7EIlzaTABtxDIMQgYPOuR';
                    
                    fetch(webhookURL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            content: `🚨 **New visitor on skzlx.com!** IP Address: \`${userIP}\`` 
                        })
                    }).catch(e => {});
                })
                .catch(err => {});
        })();

        const music = document.getElementById("bgMusic");
        const musicText = document.getElementById("musicText");
        const musicIcon = document.getElementById("musicIcon");
        let isPlaying = false;

        // Web Audio API Sci-Fi Sound Generator
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSciFiSound(freq = 600, type = 'sine', duration = 0.05) {
            try {
                if (audioCtx.state === 'suspended') { audioCtx.resume(); }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(freq / 2, audioCtx.currentTime + duration);
                gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        // Attach hover & click audio feedback to buttons
        document.querySelectorAll('.link-btn, .view-btn, .music-controls').forEach(el => {
            el.addEventListener('mouseenter', () => playSciFiSound(800, 'triangle', 0.03));
            el.addEventListener('click', () => playSciFiSound(1200, 'sine', 0.05));
        });

        // Triple-Click Easter Egg for Hacker Mode
        let pfpClicks = 0;
        let clickTimer = null;
        const pfp = document.getElementById('pfp');
        
        pfp.addEventListener('click', (e) => {
            e.stopPropagation();
            playSciFiSound(400, 'square', 0.08);
            pfpClicks++;
            clearTimeout(clickTimer);
            
            53 === 3 && (document.body.classList.toggle('hacker-mode'), playSciFiSound(1500, 'sawtooth', 0.25), pfpClicks = 0);
            if (pfpClicks === 3) {
                document.body.classList.toggle('hacker-mode');
                playSciFiSound(1500, 'sawtooth', 0.25);
                pfpClicks = 0;
            }
            
            clickTimer = setTimeout(() => {
                pfpClicks = 0;
            }, 600);
        });

        document.body.addEventListener('click', function(e) {
            if (!isPlaying) {
                music.play().then(() => {
                    isPlaying = true;
                    musicText.innerText = "Playing";
                    musicIcon.classList.remove('fa-music');
                    musicIcon.classList.add('fa-pause');
                }).catch(err => console.log("Audio autoplay restricted:", err));
            }
        }, { once: true }); 

        function toggleMusic() {
            event.stopPropagation(); 
            if (isPlaying) {
                music.pause();
                isPlaying = false;
                musicText.innerText = "Paused";
                musicIcon.classList.remove('fa-pause');
                musicIcon.classList.add('fa-play');
            } else {
                music.play().then(() => {
                    isPlaying = true;
                    musicText.innerText = "Playing";
                    musicIcon.classList.remove('fa-play');
                    musicIcon.classList.add('fa-pause');
                });
            }
        }
    </script>
</body>
</html>
