<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>skzlx</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="K65J0P9HHJ.png">

    <!-- Anti-Cache & Security Headers -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 1. Custom GIF Background with Motion Zoom Animation */
        .bg-gif {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background-image: url('background.gif');
            background-size: cover;
            background-position: center;
            animation: motionZoom 15s ease-in-out infinite alternate;
        }

        /* Smooth breathing / motion zoom effect */
        @keyframes motionZoom {
            0% { transform: scale(1); }
            100% { transform: scale(1.08); }
        }

        /* 2. Gradient & Glitchy Overlay */
        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(135deg, rgba(15, 12, 41, 0.75), rgba(48, 43, 99, 0.75), rgba(36, 36, 62, 0.85));
            animation: glitchFlicker 4s infinite;
        }

        /* Subtle glitch/flicker effect on the overlay */
        @keyframes glitchFlicker {
            0% { opacity: 0.95; }
            50% { opacity: 1; }
            52% { opacity: 0.82; }
            54% { opacity: 1; }
            80% { opacity: 0.91; }
            100% { opacity: 0.95; }
        }

        .container {
            margin-top: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 500px;
            z-index: 1;
        }

        /* Circle Profile Picture */
        .profile-pic {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background-color: #111;
            object-fit: cover;
            border: 3px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            margin-bottom: 15px;
        }

        /* Username */
        h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 30px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        /* Link Buttons */
        .link-btn {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: #fff;
            text-decoration: none;
            width: 85%;
            padding: 16px 20px;
            margin-bottom: 16px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
            position: relative;
            font-size: 16px;
            font-weight: 500;
        }

        .link-btn i {
            position: absolute;
            left: 20px;
            font-size: 20px;
        }

        .link-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        /* Music Controls Button */
        .music-controls {
            position: fixed;
            bottom: 20px;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 100;
        }
        
        .music-controls:hover {
            background: rgba(0, 0, 0, 0.8);
        }
    </style>
</head>
<body>

    <!-- Background Layers -->
    <div class="bg-gif"></div>
    <div class="bg-overlay"></div>

    <div class="container">
        <!-- Profile Picture -->
        <img src="K65J0P9HHJ.png" alt="skzlx" class="profile-pic">
        
        <h1>skzlx</h1>

        <!-- YouTube Link -->
        <a href="https://www.youtube.com/@skzlx" class="link-btn" target="_blank" rel="noopener noreferrer">
            <i class="fa-brands fa-youtube"></i> YouTube
        </a>
    </div>

    <!-- Background Music Player -->
    <audio id="bgMusic" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <div class="music-controls" onclick="toggleMusic()">
        <i class="fa-solid fa-music" id="musicIcon"></i>
        <span id="musicText">Tap anywhere to play</span>
    </div>

    <script>
        const music = document.getElementById("bgMusic");
        const musicText = document.getElementById("musicText");
        const musicIcon = document.getElementById("musicIcon");
        let isPlaying = false;

        document.body.addEventListener('click', function() {
            if (!isPlaying) {
                music.play();
                isPlaying = true;
                musicText.innerText = "Playing";
                musicIcon.classList.remove('fa-music');
                musicIcon.classList.add('fa-pause');
            }
        }, { once: true }); 

        function toggleMusic() {
            event.stopPropagation(); 
            if (isPlaying) {
                music.pause();
                isPlaying = false;
                musicText.innerText = "Paused";
                musicIcon.classList.remove('fa-pause');
                musicIcon.classList.add('fa-play');
            } else {
                music.play();
                isPlaying = true;
                musicText.innerText = "Playing";
                musicIcon.classList.remove('fa-play');
                musicIcon.classList.add('fa-pause');
            }
        }
    </script>
</body>
</html>
